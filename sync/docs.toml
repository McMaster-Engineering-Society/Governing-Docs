# Which Google Doc feeds which .tex file.
#
# - `file` is the path to the generated .tex file, relative to the repo root.
# - `id` is the long string in the doc's URL:
#       https://docs.google.com/document/d/<THIS PART>/edit
#   The doc must be shared as "Anyone with the link can view".
# - Entries whose id is still "TODO" are skipped, so you can switch sections
#   over one at a time.
#
# Only the files listed here are ever overwritten. Anything else (bylaws.tex,
# preamble.tex, title_page.tex, and any section file that just \input's other
# files) is left alone.

